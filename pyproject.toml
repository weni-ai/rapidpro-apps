[tool.poetry]
name = "weni-rp-apps"
version = "2.13.0a02"
description = "Weni apps for Rapidpro Platform"
authors = ["jcbalmeida"]
license = "AGPL-3.0"
packages = [
    { include = "weni" }
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
mozilla-django-oidc = "^2.0.0"
django-environ = "^0.7.0"
